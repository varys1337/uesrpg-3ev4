name: Validate Foundry System

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
      - "[0-9]*"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Run deterministic rules tests
        run: npm test

      - name: Validate source and dependencies
        run: |
          npm run syntax:check
          npm run lint
          npm audit --audit-level=high
          npm run schema:check
          npm run validate

      - name: Validate and stage release folder
        run: npm run build:folder
