name: Build and Publish Foundry System (GitHub Release Assets)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release_assets:
    name: Build zip and upload release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build a distributable ZIP that includes pre-compiled packs
      - name: Build system zip (uesrpg-3ev4.zip)
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist

          # Copy everything into dist EXCEPT: git metadata, CI, dev tooling
          rsync -a . dist/ \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude "automation/" \
            --exclude ".editorconfig" \
            --exclude ".gitattributes" \
            --exclude "package.json" \
            --exclude "package-lock.json"

          rm -f uesrpg-3ev4.zip
          (cd dist && zip -r ../uesrpg-3ev4.zip .)

      - name: Verify ZIP contains compiled packs
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import sys
          import zipfile

          zpath = "uesrpg-3ev4.zip"
          with zipfile.ZipFile(zpath) as zf:
            names = zf.namelist()

          current_rx = re.compile(r'(^|.*/)?packs/[^/]+/CURRENT$')
          current_hits = [n for n in names if current_rx.search(n)]
          if not current_hits:
            print("ERROR: ZIP does not appear to contain compiled LevelDB packs (missing packs/<packName>/CURRENT).")
            print("First 200 entries:")
            for n in names[:200]:
              print(" ", n)
            sys.exit(1)

          print(f"Found {len(current_hits)} compiled pack(s). Examples:")
          for n in current_hits[:20]:
            print(" ", n)

          print("ZIP verification passed.")
          PY

      - name: Create GitHub Release (if missing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release for $tag already exists."
          else
            echo "Creating release for $tag"
            gh release create "$tag" --repo="$GITHUB_REPOSITORY" --title="$tag" --generate-notes
          fi

      - name: Upload release assets (system.json + uesrpg-3ev4.zip)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          gh release upload "$tag" system.json uesrpg-3ev4.zip --clobber
