name: Build and Publish Foundry System (GitHub Release Assets)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release_assets:
    name: Build zip and upload release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Build validated release folder
        run: npm run build:folder

      - name: Validate release tag
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release workflow requires tag $expected_tag; received $GITHUB_REF_TYPE $GITHUB_REF_NAME." >&2
            exit 1
          fi

      # Package the same validated runtime folder produced by local builds.
      - name: Build system zip (uesrpg-3ev4.zip)
        shell: bash
        run: |
          rm -f uesrpg-3ev4.zip
          (cd dist/uesrpg-3ev4 && zip -r ../../uesrpg-3ev4.zip .)

      - name: Validate release archive
        run: npm run build:release -- --archive uesrpg-3ev4.zip

      - name: Create GitHub Release (if missing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release for $tag already exists."
          else
            echo "Creating release for $tag"
            gh release create "$tag" --repo="$GITHUB_REPOSITORY" --title="$tag" --generate-notes
          fi

      - name: Upload release assets (system.json + uesrpg-3ev4.zip)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          gh release upload "$tag" system.json uesrpg-3ev4.zip --clobber
