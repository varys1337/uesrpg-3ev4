name: Build and Publish Foundry System (GitHub Release Assets)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release_assets:
    name: Build zip and upload release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (CI)
        run: npm ci

      # Ensure deterministic output (no stale compiled packs)
      - name: Clean compiled packs (packs/* excluding packs/src)
        run: npm run packs-clean

      # Compiles YAML source in packs/src/** into Foundry-ready LevelDB packs in packs/** (excluding packs/src).
      - name: Compile compendium packs (packs/src -> packs/*)
        run: npm run packs-compile

      # Fail-fast verification: ensures compilation actually produced LevelDB packs like your packs.zip example.
      - name: Verify compiled packs exist and look like LevelDB
        shell: bash
        run: |
          echo "Listing packs directory:"
          ls -la packs || true

          # Ensure there is at least one compiled pack folder besides "src"
          compiled_count=$(find packs -mindepth 1 -maxdepth 1 -type d -not -name src | wc -l)
          if [ "$compiled_count" -lt 1 ]; then
            echo "ERROR: No compiled packs were produced in packs/ (only packs/src exists)."
            exit 1
          fi

          # Each compiled LevelDB pack folder should contain CURRENT and MANIFEST-*
          # Additionally verify there is at least one data file (*.ldb or *.sst)
          while IFS= read -r d; do
            echo "Checking compiled pack folder: $d"

            if [ ! -f "$d/CURRENT" ]; then
              echo "ERROR: Missing CURRENT in $d"
              ls -la "$d" || true
              exit 1
            fi

            if ! ls "$d"/MANIFEST-* >/dev/null 2>&1; then
              echo "ERROR: Missing MANIFEST-* in $d"
              ls -la "$d" || true
              exit 1
            fi

            if ! find "$d" -maxdepth 1 -type f \( -name "*.ldb" -o -name "*.sst" \) | head -n 1 | grep -q .; then
              echo "ERROR: No LevelDB data files (*.ldb or *.sst) found in $d"
              ls -la "$d" || true
              exit 1
            fi

            # Sanity: compiled pack folder should not contain YAML
            if find "$d" -maxdepth 1 -type f \( -name "*.yml" -o -name "*.yaml" \) | head -n 1 | grep -q .; then
              echo "ERROR: YAML files found in compiled pack folder $d (unexpected)"
              ls -la "$d" || true
              exit 1
            fi
          done < <(find packs -mindepth 1 -maxdepth 1 -type d -not -name src)

          echo "Compiled packs verification passed."

      - name: Build system zip (uesrpg-3ev4.zip)
        shell: bash
        run: |
          rm -f uesrpg-3ev4.zip
          zip -r uesrpg-3ev4.zip . \
            -x ".git/**" \
               ".github/**" \
               "automation/**" \
               "node_modules/**" \
               "packs/src/**" \
               ".editorconfig" \
               ".gitattributes" \
               "package.json" \
               "package-lock.json"

      # Verify the ZIP contains compiled packs and does not contain packs/src (YAML)
      - name: Verify ZIP contents (compiled packs included, YAML sources excluded)
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import sys
          import zipfile

          zpath = "uesrpg-3ev4.zip"
          with zipfile.ZipFile(zpath) as zf:
            names = zf.namelist()

          # Helper: allow optional prefix (in case the archive has a top-level folder)
          # e.g. "uesrpg-3ev4/packs/foo/CURRENT" or "packs/foo/CURRENT"
          src_rx = re.compile(r'(^|.*/)?packs/src/', re.IGNORECASE)
          current_rx = re.compile(r'(^|.*/)?packs/[^/]+/CURRENT$')

          src_hits = [n for n in names if src_rx.search(n)]
          if src_hits:
            print("ERROR: ZIP contains packs/src (YAML sources). Examples:")
            for n in src_hits[:50]:
              print(" ", n)
            sys.exit(1)

          current_hits = [n for n in names if current_rx.search(n)]
          if not current_hits:
            print("ERROR: ZIP does not appear to contain compiled LevelDB packs (missing packs/<packName>/CURRENT).")
            print("First 200 entries:")
            for n in names[:200]:
              print(" ", n)

            packs_related = [n for n in names if "packs/" in n]
            print(f"Entries containing 'packs/': {len(packs_related)}")
            for n in packs_related[:200]:
              print(" ", n)
            sys.exit(1)

          print(f"Found {len(current_hits)} compiled pack CURRENT entries. Examples:")
          for n in current_hits[:20]:
            print(" ", n)

          print("ZIP verification passed.")
          PY

      - name: Create GitHub Release (if missing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release for $tag already exists."
          else
            echo "Creating release for $tag"
            gh release create "$tag" --repo="$GITHUB_REPOSITORY" --title="$tag" --generate-notes
          fi

      - name: Upload release assets (system.json + uesrpg-3ev4.zip)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          gh release upload "$tag" system.json uesrpg-3ev4.zip --clobber
