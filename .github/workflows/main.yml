name: Build and Publish Foundry System (GitHub Release Assets)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_release_assets:
    name: Build zip and upload release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (CI)
        run: npm ci

      # Compiles YAML source in packs/src/** into Foundry-ready compiled packs in packs/** (excluding packs/src).
      - name: Compile compendium packs (packs/src -> packs/*)
        run: npm run packs-compile

      - name: Build system zip (uesrpg-3ev4.zip)
        run: |
          rm -f uesrpg-3ev4.zip
          zip -r uesrpg-3ev4.zip . \
            -x ".git/**" \
               ".github/**" \
               "automation/**" \
               "node_modules/**" \
               "packs/src/**" \
               ".editorconfig" \
               ".gitattributes" \
               "package.json" \
               "package-lock.json"

      - name: Create GitHub Release (if missing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release for $tag already exists."
          else
            echo "Creating release for $tag"
            gh release create "$tag" --repo="$GITHUB_REPOSITORY" --title="$tag" --generate-notes
          fi

      - name: Upload release assets (system.json + uesrpg-3ev4.zip)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release upload "$tag" system.json uesrpg-3ev4.zip --clobber
