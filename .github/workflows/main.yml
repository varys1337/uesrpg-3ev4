name: Build and Publish Foundry System

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_release_assets:
    name: Validate and publish immutable release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate tag, commit, and release identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release workflow requires tag $expected_tag; received $GITHUB_REF_TYPE $GITHUB_REF_NAME." >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" != "$GITHUB_SHA" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "The checked-out commit and pushed tag do not both resolve to $GITHUB_SHA." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists and will not be modified." >&2
            exit 1
          fi

      - name: Install development dependencies
        run: npm ci

      - name: Validate source and dependencies
        run: |
          npm run syntax:check
          npm run lint
          npm audit --audit-level=high
          npm run schema:check
          npm run validate

      - name: Build validated release folder
        run: npm run build:folder

      - name: Build and validate release archive
        shell: bash
        run: |
          rm -f uesrpg-3ev4.zip
          (cd dist/uesrpg-3ev4 && zip -r ../../uesrpg-3ev4.zip .)
          npm run build:release -- --archive uesrpg-3ev4.zip

      - name: Create, verify, and publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          created_draft=0
          cleanup_failed_draft() {
            if [[ "$created_draft" == "1" ]] && [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .draft 2>/dev/null)" == "true" ]]; then
              gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
            fi
          }
          trap cleanup_failed_draft ERR

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft \
            system.json \
            uesrpg-3ev4.zip
          created_draft=1
          node automation/verify-github-release.js --draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          node automation/verify-github-release.js --published
          trap - ERR
